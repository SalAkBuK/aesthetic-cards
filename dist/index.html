<style>
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }

  html { -webkit-text-size-adjust: 100%; }
  body { background: #2b2b29; }

  /* Faint blueprint grid behind everything, like the reference */
  .blueprint {
    background-image:
      linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 84px 84px;
    background-position: center top;
  }

  /* Chamfered card silhouette */
  .chamfer {
    --c: 13px;
    clip-path: polygon(
      var(--c) 0, calc(100% - var(--c)) 0,
      100% var(--c), 100% calc(100% - var(--c)),
      calc(100% - var(--c)) 100%, var(--c) 100%,
      0 calc(100% - var(--c)), 0 var(--c)
    );
  }
  @media (max-width: 640px) { .chamfer { --c: 11px; } }

  /* Dotted media panel */
  .dotgrid {
    background-image: radial-gradient(currentColor 1px, transparent 1px);
    background-size: 7px 7px;
    background-position: 0 0;
  }

  /* Dotted leader line for section labels */
  .leader {
    background-image: radial-gradient(currentColor 1px, transparent 1px);
    background-size: 6px 6px;
    background-position: 0 center;
    background-repeat: repeat-x;
  }

  /* Corner crop brackets around the media panel */
  .bracket { position: absolute; width: 13px; height: 13px; pointer-events: none; }
  .bracket::before, .bracket::after { content: ''; position: absolute; background: currentColor; }
  .bracket::before { width: 100%; height: 1px; }
  .bracket::after  { width: 1px; height: 100%; }
  .bracket.tl { top: 0; left: 0; }
  .bracket.tl::before { top: 0; left: 0; } .bracket.tl::after { top: 0; left: 0; }
  .bracket.tr { top: 0; right: 0; }
  .bracket.tr::before { top: 0; right: 0; } .bracket.tr::after { top: 0; right: 0; }
  .bracket.bl { bottom: 0; left: 0; }
  .bracket.bl::before { bottom: 0; left: 0; } .bracket.bl::after { bottom: 0; left: 0; }
  .bracket.br { bottom: 0; right: 0; }
  .bracket.br::before { bottom: 0; right: 0; } .bracket.br::after { bottom: 0; right: 0; }

  /* Draw-on for the line art is applied as SVG attributes by main.js, so
     Motion can animate them without a stylesheet rule winning over it. */

  /* Hover motion lives in CSS: transitions are interruptible and run off the
     main thread, and Motion would write SVG transforms as attributes (which
     reject px units) rather than as styles. */
  .art .ripple, .art .sign, .art .v, .art .tri {
    transform-box: fill-box;
    transform-origin: center;
  }
  .bracket { transform-origin: center; transition: transform 240ms var(--ease-out); }

  .card {
    --lift: 0px;
    --press: 1;
    transform: translateY(var(--lift)) scale(var(--press));
    transition: transform 240ms var(--ease-out);
  }
  .card-shell.is-press .card { --press: 0.985; transition-duration: 140ms; }

  @media (hover: hover) and (pointer: fine) {
    /* The card lifts; the line art stays exactly where it is. */
    .card-shell.is-hover .card { --lift: -4px; }
    .card-shell.is-hover .bracket { transform: scale(1.35); }
  }

  /* Cards start hidden only when JS will reveal them */
  .js .card-shell { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .js .card-shell { opacity: 1; }
    .card, .bracket { transition: none; }
  }
</style>
